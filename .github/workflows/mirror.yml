name: Mirror to GitLab-SH

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: self-hosted

    steps:
      - name: Mirror repository to GitLab-SH
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TFC }}

        run: |
          set -e

          MIRROR_DIR="$(mktemp -d)"
          trap 'rm -rf "$MIRROR_DIR"' EXIT

          echo "========================================"
          echo "GitHub → GitLab mirror"
          echo "========================================"

          echo "Cloning from GitHub:"
          echo "https://github.com/${GITHUB_REPOSITORY}.git"

          git clone --mirror \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$MIRROR_DIR/repo.git"

          echo "Clone completed."

          echo "Pushing to GitLab:"
          echo "https://git.harish8.com/harish/tfc.git"

          git -C "$MIRROR_DIR/repo.git" push --mirror \
            "https://oauth2:${GITLAB_TOKEN}@git.harish8.com/harish/tfc.git"

          echo "========================================"
          echo "Mirror completed successfully"
          echo "========================================"
